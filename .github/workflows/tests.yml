name: Tests

# The Jest suite (see tests/README.md) on every pull request and every push to main.
# It runs against a throwaway MongoDB started by the suite itself, with no secrets
# and no outbound network, so nothing here can reach production.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The mongod binary mongodb-memory-server downloads (~100 MB), kept between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-7.0.24
      - run: npm ci --no-audit --no-fund
      # tests/routes-misc/podcastArtCover.test.js renders real covers with ffmpeg,
      # which the runner image does not ship. A static build from GitHub, kept between
      # runs: apt-get from the Ubuntu mirror sometimes stalled until the job timed out.
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: ~/.cache/ffmpeg-static
          key: ffmpeg-static-${{ runner.os }}-n8.1
      - name: Install ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: |
          mkdir -p ~/.cache/ffmpeg-static
          curl -fsSL --retry 3 --max-time 120 \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
            | tar -xJ --strip-components=2 -C ~/.cache/ffmpeg-static --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
      - name: Put ffmpeg on PATH
        run: |
          echo "$HOME/.cache/ffmpeg-static" >> "$GITHUB_PATH"
          "$HOME/.cache/ffmpeg-static/ffmpeg" -hide_banner -version | head -1
      - name: Test with coverage
        run: npx jest --ci --coverage
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
            console.log(["### Coverage", "| | % | covered |", "|---|---|---|", ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
